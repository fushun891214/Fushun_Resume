name: Deploy to EC2

# 觸發條件：當 push 到 main 分支時
on:
  push:
    branches:
      - main
  workflow_dispatch: # 允許手動觸發

jobs:
  deploy:
    name: Deploy to EC2 Server
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 代碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. SSH 連接到伺服器並部署
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR=/home/ubuntu/resume
            OUTPUT_DIR=/home/ubuntu/resume_pdf
            BUILD_DIR=$(mktemp -d)
            trap 'rm -rf "$BUILD_DIR"' EXIT

            # 初始化部署用的 Git 工作目錄。
            if [ ! -d "$REPO_DIR/.git" ]; then
              cd /home/ubuntu
              git clone ${{ github.server_url }}/${{ github.repository }}.git resume
            fi

            cd "$REPO_DIR"

            # 部署目錄必須與遠端 main 完全一致，避免舊編譯產物阻擋 git pull。
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -ffd

            # PDF 產物置於 Git 工作目錄之外，避免後續部署造成 Git 衝突。
            mkdir -p "$OUTPUT_DIR"

            # 構建 LaTeX 編譯環境
            docker build --target builder -t sb2nov/latex .

            # 使用 XeLaTeX 產生與本機一致的中英文履歷，並在錯誤時立即停止。
            docker run --rm -i \
              -v "$REPO_DIR":/data:ro \
              -v "$BUILD_DIR":/output \
              sb2nov/latex \
              sh -lc 'cd /data && xelatex -interaction=nonstopmode -halt-on-error -output-directory=/output fushun_resume.tex'

            docker run --rm -i \
              -v "$REPO_DIR":/data:ro \
              -v "$BUILD_DIR":/output \
              sb2nov/latex \
              sh -lc 'cd /data && xelatex -interaction=nonstopmode -halt-on-error -output-directory=/output fushun_resume_zh.tex'

            install -m 0644 "$BUILD_DIR/fushun_resume.pdf" "$OUTPUT_DIR/fushun_resume.pdf"
            install -m 0644 "$BUILD_DIR/fushun_resume_zh.pdf" "$OUTPUT_DIR/fushun_resume_zh.pdf"

            # 驗證 PDF 已更新
            echo "Generated PDF files:"
            ls -lh "$OUTPUT_DIR"

            # 停止並刪除舊容器（如果存在）
            docker stop resume-web || true
            docker rm resume-web || true

            # 啟動 Python HTTP Server 提供 PDF 訪問（禁用緩存）
            docker run -d \
              --name resume-web \
              -p 8081:8081 \
              -v /home/ubuntu/resume_pdf:/data:ro \
              --restart unless-stopped \
              sb2nov/latex \
              python3 -m http.server 8081 --directory /data

            # 清理未使用的 Docker 資源
            docker system prune -f

      # 3. 部署成功通知
      - name: Deployment Status
        if: success()
        run: echo "✅ 部署成功！網站已更新於 port 8081"

      # 4. 部署失敗通知
      - name: Deployment Failed
        if: failure()
        run: echo "❌ 部署失敗，請檢查錯誤日誌"
